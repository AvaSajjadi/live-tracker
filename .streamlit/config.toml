# Live Tracker look: one calm teal accent, light background, rounded corners.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F4"
textColor = "#1F2933"
font = "sans serif"
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
