# Live Tracker look: light page, sage-grey panels, one terracotta accent, rounded corners.
[theme]
base = "light"
primaryColor = "#B76A54"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F4"
textColor = "#1F2933"
borderColor = "#DDE6E3"
font = "sans serif"
redColor = "#B91C1C"
redBackgroundColor = "#FEE2E2"
redTextColor = "#B91C1C"
yellowColor = "#B45309"
yellowBackgroundColor = "#FEF3C7"
yellowTextColor = "#B45309"
greenColor = "#15803D"
greenBackgroundColor = "#DCFCE7"
greenTextColor = "#15803D"
baseRadius = "0.6rem"

[server]
maxUploadSize = 1024        # megabytes: research videos are large

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
