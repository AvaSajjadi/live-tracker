[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-tracker"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
# optional Claude rule-proposal path (src/live_tracker/claude_agent.py); the
# offline parser, the demo and all tests work without it
claude = ["anthropic>=0.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]
